<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2a3f">
<title>SailDeck</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b2a3f'/%3E%3Cpath d='M32 10v34H16z' fill='%23f4efe6'/%3E%3Cpath d='M35 18v26h14z' fill='%232bb3a3'/%3E%3Cpath d='M12 49h40l-5 6H17z' fill='%23f4efe6'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card" autocomplete="on">
    <div class="brand big"><span class="logo" aria-hidden="true"></span><span>SailDeck</span></div>
    <p class="muted" id="login-centre"></p>
    <label>Username<input name="username" autocomplete="username" required autofocus></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="error" id="login-error" role="alert"></p>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"></span><span id="centre-name">SailDeck</span></div>
    <div class="topbar-right">
      <span id="clock" class="clock"></span>
      <span id="who" class="muted"></span>
      <button class="btn small ghost" id="logout">Sign out</button>
    </div>
  </header>
  <nav id="nav" class="nav" aria-label="Main">
    <a href="#board" data-view="board">Safety board</a>
    <a href="#fleet" data-view="fleet">Fleet</a>
    <a href="#bookings" data-view="bookings">Bookings</a>
    <a href="#people" data-view="people">People</a>
    <a href="#incidents" data-view="incidents">Incidents</a>
    <a href="#log" data-view="log">Conditions</a>
    <a href="#admin" data-view="admin">Admin</a>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
